<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="description" content="Evidence-driven BTC trading assistant dashboard. Analysis only: no order execution." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trading Assistant" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="stylesheet" href="/static/styles.css" />
  <title>Trading Assistant — Dashboard</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar">
      <div class="topbar-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <span class="brand-name">Trading Assistant</span>
          <span class="brand-sub">analysis only · no execution</span>
        </div>
      </div>
      <div class="topbar-market" id="topbar-market" aria-live="polite">
        <span class="topbar-symbol" id="topbar-symbol">—</span>
        <span class="topbar-price mono" id="topbar-price">—</span>
        <span class="badge" id="topbar-freshness" data-tone="neutral">UNKNOWN</span>
      </div>
      <nav class="sidenav" id="sidenav" aria-label="Primary">
        <a href="#/dashboard" class="nav-item" data-route="dashboard">
          <span class="nav-ico" aria-hidden="true">◧</span><span class="nav-label">Dashboard</span>
        </a>
        <a href="#/journal" class="nav-item" data-route="journal">
          <span class="nav-ico" aria-hidden="true">≡</span><span class="nav-label">Journal</span>
        </a>
        <a href="#/live" class="nav-item" data-route="live">
          <span class="nav-ico" aria-hidden="true">◉</span><span class="nav-label">Live / Paper</span>
        </a>
        <a href="#/statistics" class="nav-item" data-route="statistics">
          <span class="nav-ico" aria-hidden="true">∿</span><span class="nav-label">Statistics</span>
        </a>
        <a href="#/validation" class="nav-item" data-route="validation">
          <span class="nav-ico" aria-hidden="true">⌁</span><span class="nav-label">Validation</span>
        </a>
        <a href="#/settings" class="nav-item" data-route="settings">
          <span class="nav-ico" aria-hidden="true">✦</span><span class="nav-label">Settings</span>
        </a>
      </nav>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footnote">
      <span>Deterministic engine · journal of record · paper observations only · no orders are ever placed.</span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
