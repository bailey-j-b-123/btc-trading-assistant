<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e13" />
  <meta name="description" content="Evidence-driven BTC trading assistant dashboard. Analysis only: no order execution." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trading Assistant" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/static/icon.svg" />
  <link rel="stylesheet" href="/static/styles.css" />
  <title>Trading Assistant — BTC/USDT</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar" id="topbar">
      <a class="topbar-brand" href="#/dashboard" aria-label="Trading Assistant dashboard">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Trading Assistant</span>
      </a>
      <div class="topbar-instrument" aria-label="Market and mode">
        <span class="topbar-symbol" id="topbar-symbol">UNKNOWN</span>
        <span class="topbar-timeframe" id="topbar-timeframe">UNKNOWN</span>
        <span class="mode-pill">PAPER MODE</span>
      </div>
      <div class="topbar-meta">
        <div class="topbar-candle">
          <span class="topbar-caption">LAST COMPLETED CANDLE</span>
          <time class="topbar-candle-time mono" id="topbar-candle-time">UNKNOWN</time>
        </div>
        <div class="topbar-close">
          <span class="topbar-caption">CLOSE</span>
          <span class="topbar-price mono" id="topbar-price">UNKNOWN</span>
        </div>
        <span class="system-pill" id="topbar-status" data-tone="neutral" role="status">SYSTEM WARNING</span>
        <button class="refresh-button" id="refresh-dashboard" type="button" aria-label="Refresh dashboard" title="Refresh dashboard">
          <span aria-hidden="true">↻</span><span class="refresh-label">Refresh</span>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <footer class="footnote">
      <span>PAPER OBSERVATION ONLY · NO REAL ORDERS · Paper and historical results do not establish future profitability.</span>
      <a class="footnote-link" href="#/journal">Open journal</a>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
