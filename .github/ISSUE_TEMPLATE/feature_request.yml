name: Feature request / new workstream
description: Propose new functionality or a deliberate change to existing behaviour.
title: "[feature] "
body:
  - type: textarea
    id: what
    attributes:
      label: What should happen
      description: Describe the desired behaviour and the problem it solves.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "How will we know it is done? Include the tests that must pass."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Explicitly out of scope
      description: What this must NOT touch, to keep the change minimal.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety constraints
      description: Tick everything that applies to this task (all apply by default).
      options:
        - No trading-strategy changes
        - No access to stored trading records or production databases
        - No historical backfill
        - No credentials or API keys involved
        - No deployment or merge automation
    validations:
      required: true
