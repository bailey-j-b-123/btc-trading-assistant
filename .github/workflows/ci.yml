name: CI

# Runs on GitHub-hosted runners only (ubuntu-latest), never a personal
# machine. This workflow:
#   * uses NO secrets (no API keys, exchange credentials, or tokens),
#   * grants minimal permissions (contents: read only),
#   * never accesses a production database (tests create temporary SQLite
#     files in the runner workspace and use offline fake-exchange fixtures),
#   * never contacts an exchange, places an order, or trades anything,
#   * performs no merges, deployments, or other side effects.
# It is deliberately NOT triggered by pull_request_target: that trigger
# checks out PR head code while the token carries the base-branch
# permission scope, which is exactly the footgun it exists to avoid.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency: pyproject.toml

      - name: Install the project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the full Python test suite
        # The guarded pytest runner preserves the single documented xfail
        # (tests/test_decision_invariance.py) remains an expected failure —
        # it is a pinned, known defect and is never run with --runxfail.
        run: |
          mkdir -p "$RUNNER_TEMP/brain-test-home"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --no-new-privs \
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/brain-test-home" TMPDIR="$RUNNER_TEMP" \
            python scripts/offline_pytest.py --junitxml=.pytest_cache/python-results.xml

      - name: Report Python result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "Python tests: $JOB_STATUS. See job logs for exact counts. Test execution uses a network namespace, cleared environment, and temporary SQLite state." >> "$GITHUB_STEP_SUMMARY"

  js-tests:
    name: JavaScript tests (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the frontend test suite
        # package.json declares zero dependencies, so `npm test`
        # (node --test tests/frontend/*.test.mjs) needs no install step.
        run: |
          mkdir -p "$RUNNER_TEMP/brain-test-home"
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --no-new-privs \
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/brain-test-home" TMPDIR="$RUNNER_TEMP" npm test

      - name: Report JavaScript result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "JavaScript tests: $JOB_STATUS. See job logs for exact counts. Test execution uses a network namespace and a cleared environment." >> "$GITHUB_STEP_SUMMARY"
